name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# id-token: write enables OIDC. The npm CLI exchanges this OIDC token for a
# short-lived publish credential via npm Trusted Publishing — no long-lived
# NPM_TOKEN secret is needed. The same id-token is also what gives the
# published package its supply-chain provenance attestation.
#
# Setup (one-time):
#   1. Publish the first version manually OR pre-configure the trusted
#      publisher on npmjs.com so this workflow can claim the package.
#   2. On npmjs.com → package settings → "Manage Trusted Publishers", add:
#        Repository:        euricojardim/smb3-client
#        Workflow filename: publish.yml
#        Environment:       (leave blank, or match `environment:` below)
#
# Once that trust is registered, this workflow can publish without any
# secret in the repo.

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish smb3-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm package version matches the tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "publishing version $PKG_VERSION"

      - name: Verify
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Publish via Trusted Publishing (no NPM_TOKEN required)
        run: npm publish --provenance --access public
